# Cocoya CI
#
# 【分層設計與實測依據】
# 2026-10-04 量測：Node 409 例約 7s、Rust 12 例約 0.02s、
# Python Tier1（8 例）約 9s、Tier2（含真實訓練）約 67s。
#
# 三個 job 拆開的理由是**依賴不同**，而非為了速度：
#   - node 只需 Node.js
#   - rust 只需 Rust toolchain（Tauri 的系統依賴在 Windows runner 已預裝）
#   - python 需 Python + TensorFlow（TF import 實測 4.7s，佔 Tier1 一半）
# 合在一起會迫使每個 job 都裝齊所有依賴。
#
# 【Python 分層】
# - PR：只跑 Tier 1（`-m "not slow"`）。9 秒，且仍覆蓋資料集匯出、
#        佈局契約、分層切分、偵測曲線、dataloader。
# - push 到 master：跑全量（含 3 個真實訓練測試，約 67s）。
#   理由：訓練模板改動只佔 2%，但在 master 上必須確保端到端可用。
#
# 【注意】若 `npm test` 報 timeout 而非失敗，先確認是否新增了 slow 測試
# 而忘了加 marker（會拖慢預設路徑）。

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 同一分支的新 push 會取消前一次未完成的執行（省 runner 時間）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node（前端 + TS + 行尾 + 路徑守門）
    runs-on: windows-latest
    env:
      # husky 在 CI 不需要安裝 git hook（那是本機工作樹的事）。
      # npm ci 會執行 prepare 腳本 -> husky，該命令在 CI 下是無意義的開銷。
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ⚠️ 必須與本機一致（Node 24 / npm 11）。
          #   實測教訓（2026-10-04）：package-lock.json 由 npm 11 產生，
          #   但 npm 10（Node 20 內建）對 **optional peer dependency** 的解析不同，
          #   會推導出 lock 檔裡沒有的 @emnapi/* 而報
          #   「Missing: @emnapi/core from lock file」，npm ci 直接失敗。
          #   同一份 lock 檔在本機 npm 11 下 `npm ci` 正常 —— 是版本差異，不是檔案壞掉。
          #   故對齊版本是正解（比放寬成 `npm install` 好：後者會讓 lock 漂移）。
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      # ⚠️ **釘選 npm 版本**（不是只靠 node-version）。
      #   實測教訓兩次（2026-10-04）：
      #     1. Node 20(→npm 10) 報 @emnapi 缺漏
      #     2. 改成 Node 24 後仍報 —— 因為 Node 24 對應的 npm 版本比本機的
      #        11.6.2 更新，兩者對 **optional peer dependency** 的推導不同。
      #
      #   這是 npm 的已知行為差異，不是 lock 檔壞掉（同一份 lock 在本機可正常 npm ci）。
      #   猜「node 24 對應哪個 npm」不可靠 —— 直接釘選最省事也最保險。
      #
      #   本機版本可查：npm --version（改動 lock 檔時務必用同一版本驗證）
      - name: 釘選 npm 版本（與產生 lock 檔的環境一致）
        run: npm install -g npm@11.6.2
        # ↑ 請與本機 `npm --version` 的輸出保持一致

      - name: 安裝依賴（根 + ui）
        run: |
          npm ci
          npm ci --prefix ui

      # ⚠️ sidecar_module_split.test.mjs 有 13 個守門，其中 2 個（模組獨立匯入 /
      #   py_compile）需要真的執行 Python。其餘 11 個是純檔案掃描，不需要。
      #
      #   這裡刻意**不**用 requirements-dev.txt：它含 tensorflow（350MB），
      #   而這兩個守門只需要 sidecar 模組的頂層依賴。
      #   sidecar 的**端到端**驗證（真的啟動並收 JSON）由 python job 的
      #   tests/e2e/test_export_dataset.py 負責 —— 兩者分工不重疊。
      #
      #   用 opencv-python-headless 而非 opencv-python：後者會拉進 GUI 依賴，
      #   在無桌面的 runner 上既用不到又佔空間（這裡只做 import 檢查）。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安裝 sidecar 守門所需的最小 Python 依賴（不含 TF）
        run: python -m pip install numpy opencv-python-headless paramiko cryptography

      - name: 測試（compile + lint + 409 例 + 行尾 + runtime paths 守門）
        # ⚠️ 刻意用 test:unit + test:ui，**不是** `npm test`。
        #   `npm test` 末端含 `test:rust`（cargo test），但本 job 未安裝 Rust
        #   —— 那是獨立 job 的職責。在這裡跑會因「cargo 不存在」而 exit code 1。
        run: npm run test:unit && npm run test:ui

  rust:
    name: Rust（序列化契約 / command 註冊 / 多視窗 emit）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Tauri 在 Windows 需要 WebView2 與 MSVC；runner 已預裝，
      # 但 cargo test 只需編譯測試目標，仍需 tauri 的 build 依賴。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  python-fast:
    name: Python Tier 1（9s，不含真實訓練）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          # ⚠️ 必須指定：setup-python 的 pip 快取默記只找
          #   **/requirements.txt 與 pyproject.toml，不會找 requirements-dev.txt。
          #   實測錯誤：未指定時报
          #   "No file matched to [**/requirements.txt or **/pyproject.toml]"。
          cache-dependency-path: requirements-dev.txt

      # ⚠️ TensorFlow 雖只在「訓練」時才需要，但
      #   tests/e2e/test_classifier_dataloader.py 在**模組層級** import tensorflow
      #   （它測的是真實 tf.data.Dataset + reduce_min/max，無法用假資料取代），
      #   故 Tier 1 仍必須安裝 TF。實測 TF import 佔 Tier 1 時間的一半。
      - name: 安裝測試依賴
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Tier 1（-m "not slow"）
        run: python -m pytest -q -m "not slow"

  python-full:
    name: Python 全量（含真實訓練，僅 master）
    runs-on: windows-latest
    # 只在 push 到 master 時跑；PR 不跑（避免重複消耗且 67s 對 PR 反饋無益）
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          # ⚠️ 必須指定：setup-python 的 pip 快取默記只找
          #   **/requirements.txt 與 pyproject.toml，不會找 requirements-dev.txt。
          #   實測錯誤：未指定時报
          #   "No file matched to [**/requirements.txt or **/pyproject.toml]"。
          cache-dependency-path: requirements-dev.txt

      - name: 安裝測試依賴
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 全量（含 slow 組）
        run: python -m pytest -q