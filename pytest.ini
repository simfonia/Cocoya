[pytest]
testpaths = tests
# -q：精簡輸出（本專案測試數多，完整節點列表會淹沒重點）
addopts = -q --strict-markers
# [2026-10-04] 分層標記：需真實執行訓練（subprocess + TensorFlow import），
# 單檔約 7-40 秒、整組約 59 秒；其餘 8 個測試合計僅 3.6 秒。
# 預設由 scripts/pytest-layers.cjs 依 git diff 自動跳過 slow 組。
# ⚠️ 新增訓練測試時務必加此 marker，否則會拖慢預設路徑。
markers =
    slow: 需真實執行訓練（約 10-40 秒），僅在改動訓練路徑時才跑
# 訓練組需 numpy/tensorflow，缺失時明確報錯而非靜默 skip
filterwarnings =
    ignore::DeprecationWarning
