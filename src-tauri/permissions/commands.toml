[[permission]]
identifier = "allow-all-commands"
description = "Allows all custom commands for Cocoya"
commands.allow = [
  "run_python",
  "stop_python",
  "get_manifest",
  "get_module_toolbox",
  "open_file",
  "save_file",
  "get_serial_ports",
  "deploy_mcu",
  "open_serial_monitor",
  "setup_stable_mode",
  "erase_filesystem",
  "auto_backup",
  "clear_backup",
  "reject_recovery",
  "reset_firmware",
  "create_window",
  "set_window_title",
  "pick_python_path",
  "get_version",
  "check_environment",
  "set_dirty",
  "close_window",
  "check_startup_backup",
  "open_examples",
  "start_sidecar",
  "sidecar_send",
  "stop_sidecar",
  "dataset_upload_chunk",
  "delete_file",
  "pick_folder",
  "export_dataset",
  "open_report",
  "find_latest_training_report",
  "get_project_anchor",
  "dataset_save_progress",
  "dataset_load_progress",
  "dataset_import_from_folder",
  "open_folder",
  "set_window_focus"
]
